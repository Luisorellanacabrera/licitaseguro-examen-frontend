<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" role="img" aria-label="Mockup de la vista Busqueda de proveedores por RUT en laptop, tablet y movil, incluyendo los estados de error">
  <title>Mockup Vista 4 - Busqueda de proveedores por RUT</title>
  <style>
    .t{font-family:'Segoe UI',Arial,sans-serif}
    .tit{font-size:17px;font-weight:700;fill:#0b3c5d}
    .sub{font-size:12px;fill:#52606d}
    .lbl{font-size:11px;fill:#52606d}
    .err{font-size:10px;font-weight:700;fill:#b42318}
    .btxt{font-size:11px;font-weight:700;fill:#ffffff}
    .box{fill:#ffffff;stroke:#d7dee6;stroke-width:1.5;rx:8}
    .nota{font-size:10px;fill:#8a4b00}
  </style>
  <rect width="1100" height="760" fill="#f5f7fa"/>
  <text class="t tit" x="24" y="30">Vista 4 - Busqueda de proveedores por RUT (mockup)</text>
  <text class="t sub" x="24" y="48">Flujo: RUT -> validacion modulo 11 -> loader -> ficha del proveedor o mensaje "Proveedor no encontrado"</text>

  <!-- LAPTOP -->
  <text class="t lbl" x="24" y="76">LAPTOP 1366px - formulario a la izquierda, resultado a la derecha</text>
  <rect class="box" x="24" y="86" width="660" height="400"/>
  <rect x="24" y="86" width="660" height="30" fill="#0b3c5d" rx="8"/>
  <circle cx="44" cy="101" r="8" fill="#f2a65a"/>
  <text class="t btxt" x="58" y="105">LicitaSeguro</text>
  <text class="t btxt" x="470" y="105">Inicio  Licitaciones  Detalle  Proveedores</text>
  <text class="t lbl" x="44" y="132">Inicio / Proveedores</text>
  <text class="t tit" x="44" y="154">Busqueda de proveedores</text>

  <rect class="box" x="44" y="166" width="300" height="130"/>
  <text class="t lbl" x="58" y="186">RUT del proveedor *</text>
  <rect x="58" y="192" width="270" height="26" fill="#ffffff" stroke="#52606d" rx="5"/>
  <text class="t lbl" x="66" y="209">77.653.382-3</text>
  <text class="t lbl" x="58" y="230" font-size="9">Se admite con o sin puntos; el formato se completa solo.</text>
  <rect x="58" y="242" width="124" height="26" fill="#146c94" rx="5"/>
  <text class="t btxt" x="76" y="259">Buscar proveedor</text>
  <rect x="190" y="242" width="126" height="26" fill="none" stroke="#52606d" rx="5"/>
  <text class="t lbl" x="204" y="259">RUT de ejemplo</text>

  <rect class="box" x="360" y="166" width="304" height="130"/>
  <rect x="374" y="180" width="104" height="18" fill="#e6f4ea" rx="9"/>
  <text class="t" x="382" y="193" font-size="9" fill="#0f5132">Proveedor encontrado</text>
  <text class="t tit" x="374" y="218" font-size="13">SERVICIOS Y SOLUCIONES</text>
  <text class="t tit" x="374" y="234" font-size="13">INFORMATICAS FENRIR SPA</text>
  <text class="t lbl" x="374" y="256">RUT consultado        77.653.382-3</text>
  <text class="t lbl" x="374" y="274">Codigo de empresa   1968779</text>

  <!-- Estados de error -->
  <text class="t lbl" x="44" y="320">Estados de error previstos (se muestran justo bajo el campo o como alerta):</text>
  <rect class="box" x="44" y="328" width="300" height="70"/>
  <rect x="58" y="340" width="270" height="24" fill="#ffffff" stroke="#b42318" stroke-width="2" rx="5"/>
  <text class="t lbl" x="66" y="356">77.653.382-K</text>
  <text class="t err" x="58" y="378">El digito verificador no corresponde. Para</text>
  <text class="t err" x="58" y="392">77.653.382 el digito correcto es 3.</text>

  <rect x="360" y="328" width="304" height="32" fill="#fff7e6" stroke="#8a4b00" rx="5"/>
  <text class="t" x="372" y="348" font-size="10" fill="#8a4b00">Proveedor no encontrado: el RUT no esta registrado.</text>
  <rect x="360" y="366" width="304" height="32" fill="#fdecea" stroke="#b42318" rx="5"/>
  <text class="t" x="372" y="386" font-size="10" fill="#b42318">Servidor no disponible. Intente mas tarde.</text>

  <rect x="44" y="412" width="620" height="24" fill="#eef3f7" rx="5"/>
  <circle cx="60" cy="424" r="6" fill="none" stroke="#146c94" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="t lbl" x="76" y="428">Loader: "Buscando el proveedor en Mercado Publico..."</text>

  <!-- TABLET -->
  <text class="t lbl" x="712" y="76">TABLET 768px - una columna</text>
  <rect class="box" x="712" y="86" width="240" height="400"/>
  <rect x="712" y="86" width="240" height="28" fill="#0b3c5d" rx="8"/>
  <rect x="922" y="93" width="20" height="14" fill="#ffffff" rx="3"/>
  <rect class="box" x="724" y="124" width="216" height="80"/>
  <rect x="734" y="140" width="196" height="20" fill="#ffffff" stroke="#52606d" rx="4"/>
  <rect x="734" y="168" width="94" height="20" fill="#146c94" rx="4"/>
  <rect x="836" y="168" width="94" height="20" fill="none" stroke="#52606d" rx="4"/>
  <rect class="box" x="724" y="214" width="216" height="90"/>
  <text class="t lbl" x="734" y="234" font-size="9">Ficha del proveedor</text>
  <rect class="box" x="724" y="314" width="216" height="70"/>
  <text class="t lbl" x="734" y="334" font-size="9">Historial de la sesion</text>
  <rect class="box" x="724" y="394" width="216" height="66"/>
  <text class="t lbl" x="734" y="414" font-size="9">Como se valida el RUT</text>

  <!-- MOVIL -->
  <text class="t lbl" x="980" y="76">MOVIL 375px</text>
  <rect class="box" x="980" y="86" width="96" height="400"/>
  <rect x="980" y="86" width="96" height="24" fill="#0b3c5d" rx="8"/>
  <rect x="1054" y="92" width="14" height="11" fill="#ffffff" rx="2"/>
  <rect class="box" x="988" y="118" width="80" height="76"/>
  <rect x="996" y="130" width="64" height="16" fill="#ffffff" stroke="#52606d" rx="3"/>
  <rect x="996" y="152" width="64" height="16" fill="#146c94" rx="3"/>
  <rect x="996" y="172" width="64" height="16" fill="none" stroke="#52606d" rx="3"/>
  <rect class="box" x="988" y="204" width="80" height="80"/>
  <rect class="box" x="988" y="294" width="80" height="60"/>
  <rect class="box" x="988" y="364" width="80" height="80"/>

  <!-- Justificacion -->
  <rect class="box" x="24" y="506" width="1052" height="230"/>
  <text class="t tit" x="44" y="532" font-size="14">Justificacion UI/UX de esta vista</text>
  <text class="t lbl" x="44" y="556">Prevencion y recuperacion de errores (Nielsen 5 y 9): el RUT se formatea automaticamente mientras se escribe y cada error explica la causa y como corregirla.</text>
  <text class="t lbl" x="44" y="576">Mensajes especificos, no genericos: campo vacio, caracteres invalidos, largo incorrecto, K mal ubicada y digito verificador erroneo tienen textos distintos.</text>
  <text class="t lbl" x="44" y="596">Reconocer antes que recordar (Nielsen 6): el boton "Usar RUT de ejemplo" y el historial de consultas de la sesion evitan que el usuario memorice RUT.</text>
  <text class="t lbl" x="44" y="616">Los tres resultados posibles (encontrado, no encontrado, servidor caido) se distinguen por color, icono y texto, cumpliendo WCAG 1.4.1.</text>
  <text class="t lbl" x="44" y="636">Accesibilidad: el mensaje de error vive en un span con role="alert" y aria-live="polite" asociado al input por aria-describedby; ademas se marca aria-invalid.</text>
  <text class="t lbl" x="44" y="656">Al fallar la validacion el foco vuelve al campo del RUT, para que quien navega con teclado no tenga que buscar el error.</text>
  <text class="t nota" x="44" y="686">Reordenamiento responsivo: dos columnas en laptop (formulario | resultado) - una columna en tablet y movil, con el resultado inmediatamente debajo</text>
  <text class="t nota" x="44" y="706">del formulario y el boton de busqueda a ancho completo.</text>
</svg>
