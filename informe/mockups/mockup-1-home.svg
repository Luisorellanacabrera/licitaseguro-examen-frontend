<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" role="img" aria-label="Mockup de la vista Home corporativo de LicitaSeguro en sus versiones laptop, tablet y movil">
  <title>Mockup Vista 1 - Home corporativo</title>
  <style>
    .t{font-family:'Segoe UI',Arial,sans-serif}
    .tit{font-size:17px;font-weight:700;fill:#0b3c5d}
    .sub{font-size:12px;fill:#52606d}
    .lbl{font-size:11px;fill:#52606d}
    .btxt{font-size:11px;font-weight:700;fill:#ffffff}
    .h1m{font-size:14px;font-weight:700;fill:#ffffff}
    .nota{font-size:10px;fill:#8a4b00}
    .box{fill:#ffffff;stroke:#d7dee6;stroke-width:1.5;rx:8}
  </style>
  <rect width="1100" height="760" fill="#f5f7fa"/>
  <text class="t tit" x="24" y="30">Vista 1 - Home corporativo (mockup)</text>
  <text class="t sub" x="24" y="48">Jerarquia: logo + menu / hero con llamado a la accion / grilla de 6 modulos / contacto / pie</text>

  <!-- LAPTOP -->
  <text class="t lbl" x="24" y="76">LAPTOP 1366px - grilla de 3 columnas</text>
  <rect class="box" x="24" y="86" width="660" height="400"/>
  <rect x="24" y="86" width="660" height="34" fill="#0b3c5d" rx="8"/>
  <circle cx="44" cy="103" r="8" fill="#f2a65a"/>
  <text class="t btxt" x="58" y="107">LicitaSeguro</text>
  <text class="t btxt" x="420" y="107">Inicio  Licitaciones  Detalle  Proveedores  Contacto</text>

  <rect x="24" y="120" width="660" height="110" fill="#0e5074"/>
  <text class="t h1m" x="44" y="155">Licitaciones publicas de Chile, claras y al alcance de todos</text>
  <text class="t" x="44" y="175" font-size="11" fill="#eaf2f8">Informacion oficial de Mercado Publico, ordenada y accesible.</text>
  <rect x="44" y="188" width="118" height="28" fill="#146c94" rx="6"/>
  <text class="t btxt" x="68" y="206">Ver licitaciones</text>
  <rect x="172" y="188" width="128" height="28" fill="none" stroke="#ffffff" stroke-width="1.5" rx="6"/>
  <text class="t btxt" x="192" y="206">Buscar proveedor</text>
  <rect class="box" x="470" y="140" width="196" height="72"/>
  <text class="t lbl" x="482" y="162">Datos oficiales</text>
  <text class="t lbl" x="482" y="180">API publica de</text>
  <text class="t lbl" x="482" y="196">Mercado Publico</text>

  <text class="t tit" x="44" y="258" font-size="13">Que puedes hacer en LicitaSeguro</text>
  <g>
    <rect class="box" x="44" y="270" width="192" height="98"/><rect class="box" x="248" y="270" width="192" height="98"/><rect class="box" x="452" y="270" width="192" height="98"/>
    <rect class="box" x="44" y="378" width="192" height="94"/><rect class="box" x="248" y="378" width="192" height="94"/><rect class="box" x="452" y="378" width="192" height="94"/>
    <text class="t lbl" x="58" y="294">Consultar licitaciones</text><text class="t lbl" x="262" y="294">Filtrar por fecha/estado</text><text class="t lbl" x="466" y="294">Ver el detalle</text>
    <text class="t lbl" x="58" y="402">Buscar proveedor</text><text class="t lbl" x="262" y="402">Accesibilidad</text><text class="t lbl" x="466" y="402">Responsivo</text>
    <rect x="58" y="330" width="120" height="24" fill="#146c94" rx="5"/><text class="t btxt" x="82" y="346">Ir al listado</text>
    <rect x="262" y="330" width="120" height="24" fill="#146c94" rx="5"/><text class="t btxt" x="288" y="346">Filtrar ahora</text>
    <rect x="466" y="330" width="120" height="24" fill="#146c94" rx="5"/><text class="t btxt" x="492" y="346">Ver detalle</text>
  </g>

  <!-- TABLET -->
  <text class="t lbl" x="712" y="76">TABLET 768px - 2 columnas</text>
  <rect class="box" x="712" y="86" width="240" height="400"/>
  <rect x="712" y="86" width="240" height="30" fill="#0b3c5d" rx="8"/>
  <circle cx="730" cy="101" r="7" fill="#f2a65a"/>
  <text class="t btxt" x="742" y="105">LicitaSeguro</text>
  <rect x="922" y="93" width="20" height="16" fill="#ffffff" rx="3"/>
  <rect x="712" y="116" width="240" height="78" fill="#0e5074"/>
  <text class="t btxt" x="726" y="142">Licitaciones publicas</text>
  <text class="t btxt" x="726" y="158">de Chile</text>
  <rect x="726" y="166" width="100" height="20" fill="#146c94" rx="5"/>
  <text class="t btxt" x="744" y="180" font-size="9">Ver licitaciones</text>
  <rect class="box" x="726" y="210" width="102" height="72"/><rect class="box" x="838" y="210" width="102" height="72"/>
  <rect class="box" x="726" y="292" width="102" height="72"/><rect class="box" x="838" y="292" width="102" height="72"/>
  <rect class="box" x="726" y="374" width="102" height="72"/><rect class="box" x="838" y="374" width="102" height="72"/>

  <!-- MOVIL -->
  <text class="t lbl" x="980" y="76">MOVIL 375px</text>
  <rect class="box" x="980" y="86" width="96" height="400"/>
  <rect x="980" y="86" width="96" height="26" fill="#0b3c5d" rx="8"/>
  <circle cx="994" cy="99" r="6" fill="#f2a65a"/>
  <rect x="1054" y="93" width="14" height="12" fill="#ffffff" rx="2"/>
  <rect x="980" y="112" width="96" height="66" fill="#0e5074"/>
  <text class="t btxt" x="990" y="136" font-size="8">Licitaciones</text>
  <text class="t btxt" x="990" y="148" font-size="8">publicas</text>
  <rect x="990" y="154" width="76" height="16" fill="#146c94" rx="4"/>
  <rect class="box" x="990" y="190" width="76" height="46"/><rect class="box" x="990" y="244" width="76" height="46"/>
  <rect class="box" x="990" y="298" width="76" height="46"/><rect class="box" x="990" y="352" width="76" height="46"/>
  <rect class="box" x="990" y="406" width="76" height="46"/>

  <!-- Justificacion -->
  <rect class="box" x="24" y="506" width="1052" height="230"/>
  <text class="t tit" x="44" y="532" font-size="14">Justificacion UI/UX de esta vista</text>
  <text class="t lbl" x="44" y="556">Jerarquia visual: el titulo H1 del hero es el elemento de mayor peso (31px, blanco sobre azul 10.4:1); le siguen los H2 de seccion (25px) y el cuerpo (16px).</text>
  <text class="t lbl" x="44" y="576">Ley de Fitts: los botones de accion miden 44px de alto minimo y en movil ocupan el 100% del ancho, facilitando el toque con el pulgar.</text>
  <text class="t lbl" x="44" y="596">Color: azul institucional #0b3c5d (confianza, sector publico) + naranja #f2a65a solo como acento de foco y estado activo. Contraste AA/AAA verificado.</text>
  <text class="t lbl" x="44" y="616">Tipografia: Segoe UI / system-ui, sin serifa, de alta legibilidad en pantalla; escala modular 1.25; interlineado 1.6 (WCAG 1.4.12).</text>
  <text class="t lbl" x="44" y="636">Consistencia (Nielsen 4): el mismo header, footer, paleta y estilo de tarjeta se repiten en las 4 vistas, de modo que el usuario no reaprende la interfaz.</text>
  <text class="t lbl" x="44" y="656">Accesibilidad: enlace "saltar al contenido", menu con aria-expanded, formulario de contacto con label + aria-describedby, e iconos marcados aria-hidden.</text>
  <text class="t lbl" x="44" y="676">Ley de Hick: solo 5 opciones en el menu principal y 6 tarjetas de modulo, para no sobrecargar la decision del usuario.</text>
  <text class="t nota" x="44" y="702">Reordenamiento responsivo: 3 columnas en laptop (>=992px) - 2 columnas en tablet (576-991px) - 1 columna y menu hamburguesa en movil (&lt;576px).</text>
</svg>
