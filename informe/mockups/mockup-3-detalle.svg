<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" role="img" aria-label="Mockup de la vista Detalle de licitacion en laptop, tablet y movil">
  <title>Mockup Vista 3 - Detalle de licitacion</title>
  <style>
    .t{font-family:'Segoe UI',Arial,sans-serif}
    .tit{font-size:17px;font-weight:700;fill:#0b3c5d}
    .sub{font-size:12px;fill:#52606d}
    .lbl{font-size:11px;fill:#52606d}
    .btxt{font-size:11px;font-weight:700;fill:#ffffff}
    .box{fill:#ffffff;stroke:#d7dee6;stroke-width:1.5;rx:8}
    .nota{font-size:10px;fill:#8a4b00}
  </style>
  <rect width="1100" height="760" fill="#f5f7fa"/>
  <text class="t tit" x="24" y="30">Vista 3 - Detalle de licitacion (mockup)</text>
  <text class="t sub" x="24" y="48">Flujo: codigo recibido por URL o escrito a mano -> loader -> ficha completa con tabla de antecedentes e items</text>

  <!-- LAPTOP -->
  <text class="t lbl" x="24" y="76">LAPTOP 1366px</text>
  <rect class="box" x="24" y="86" width="660" height="400"/>
  <rect x="24" y="86" width="660" height="30" fill="#0b3c5d" rx="8"/>
  <circle cx="44" cy="101" r="8" fill="#f2a65a"/>
  <text class="t btxt" x="58" y="105">LicitaSeguro</text>
  <text class="t btxt" x="470" y="105">Inicio  Licitaciones  Detalle  Proveedores</text>
  <text class="t lbl" x="44" y="132">Inicio / Licitaciones / Detalle</text>
  <text class="t tit" x="44" y="154">Detalle de la licitacion</text>

  <rect class="box" x="44" y="164" width="620" height="60"/>
  <text class="t lbl" x="58" y="182">Codigo de la licitacion *</text>
  <rect x="58" y="188" width="300" height="26" fill="#ffffff" stroke="#52606d" rx="5"/>
  <text class="t lbl" x="66" y="205">1057539-17-LR25</text>
  <rect x="372" y="188" width="110" height="26" fill="#146c94" rx="5"/>
  <text class="t btxt" x="392" y="205">Ver detalle</text>
  <rect x="492" y="188" width="140" height="26" fill="none" stroke="#52606d" rx="5"/>
  <text class="t lbl" x="510" y="205">Volver al listado</text>

  <rect x="44" y="234" width="86" height="18" fill="#e7f0fb" rx="9"/>
  <text class="t" x="52" y="247" font-size="9" fill="#0b3c5d">Adjudicada</text>
  <text class="t tit" x="44" y="272" font-size="14">CONVENIO SUMINISTRO INTER QUIRURGICAS COLUMNA</text>
  <text class="t lbl" x="44" y="288">Codigo 1057539-17-LR25</text>

  <rect class="box" x="44" y="298" width="620" height="54"/>
  <text class="t lbl" x="58" y="316">Descripcion</text>
  <line x1="58" y1="326" x2="640" y2="326" stroke="#e3e9ee" stroke-width="6"/>
  <line x1="58" y1="338" x2="560" y2="338" stroke="#e3e9ee" stroke-width="6"/>

  <rect class="box" x="44" y="360" width="620" height="112"/>
  <text class="t lbl" x="58" y="378">Antecedentes generales (tabla de 2 columnas)</text>
  <g>
    <rect x="58" y="386" width="220" height="20" fill="#eef3f7"/><rect x="278" y="386" width="366" height="20" fill="#ffffff" stroke="#e3e9ee"/>
    <text class="t lbl" x="66" y="400">Estado / Tipo / Moneda</text><text class="t lbl" x="286" y="400">Valor obtenido de la API o "--"</text>
    <rect x="58" y="408" width="220" height="20" fill="#f7f9fb"/><rect x="278" y="408" width="366" height="20" fill="#ffffff" stroke="#e3e9ee"/>
    <text class="t lbl" x="66" y="422">Fechas (creacion, cierre)</text><text class="t lbl" x="286" y="422">21-09-2026 15:10 hrs.</text>
    <rect x="58" y="430" width="220" height="20" fill="#eef3f7"/><rect x="278" y="430" width="366" height="20" fill="#ffffff" stroke="#e3e9ee"/>
    <text class="t lbl" x="66" y="444">Organismo / Unidad / Region</text><text class="t lbl" x="286" y="444">Hospital Puerto Montt</text>
    <rect x="58" y="452" width="586" height="14" fill="#f7f9fb" stroke="#e3e9ee"/>
    <text class="t lbl" x="66" y="463" font-size="9">Tabla de items solicitados (producto, descripcion, cantidad, unidad)</text>
  </g>

  <!-- TABLET -->
  <text class="t lbl" x="712" y="76">TABLET 768px</text>
  <rect class="box" x="712" y="86" width="240" height="400"/>
  <rect x="712" y="86" width="240" height="28" fill="#0b3c5d" rx="8"/>
  <rect x="922" y="93" width="20" height="14" fill="#ffffff" rx="3"/>
  <rect class="box" x="724" y="124" width="216" height="46"/>
  <rect x="734" y="134" width="140" height="18" fill="#ffffff" stroke="#52606d" rx="4"/>
  <rect x="882" y="134" width="48" height="18" fill="#146c94" rx="4"/>
  <rect class="box" x="724" y="180" width="216" height="40"/>
  <rect class="box" x="724" y="228" width="216" height="130"/>
  <text class="t lbl" x="734" y="246" font-size="9">Tabla en 2 columnas (encabezado 45%)</text>
  <line x1="734" y1="256" x2="930" y2="256" stroke="#e3e9ee" stroke-width="8"/>
  <line x1="734" y1="272" x2="930" y2="272" stroke="#eef3f7" stroke-width="8"/>
  <line x1="734" y1="288" x2="930" y2="288" stroke="#e3e9ee" stroke-width="8"/>
  <line x1="734" y1="304" x2="930" y2="304" stroke="#eef3f7" stroke-width="8"/>
  <rect class="box" x="724" y="366" width="216" height="94"/>
  <text class="t lbl" x="734" y="384" font-size="9">Items con scroll horizontal propio</text>

  <!-- MOVIL -->
  <text class="t lbl" x="980" y="76">MOVIL 375px</text>
  <rect class="box" x="980" y="86" width="96" height="400"/>
  <rect x="980" y="86" width="96" height="24" fill="#0b3c5d" rx="8"/>
  <rect x="1054" y="92" width="14" height="11" fill="#ffffff" rx="2"/>
  <rect class="box" x="988" y="118" width="80" height="56"/>
  <rect x="996" y="128" width="64" height="16" fill="#ffffff" stroke="#52606d" rx="3"/>
  <rect x="996" y="150" width="64" height="16" fill="#146c94" rx="3"/>
  <rect class="box" x="988" y="184" width="80" height="40"/>
  <rect class="box" x="988" y="234" width="80" height="140"/>
  <text class="t lbl" x="996" y="250" font-size="8">Tabla apilada</text>
  <line x1="996" y1="260" x2="1060" y2="260" stroke="#e3e9ee" stroke-width="7"/>
  <line x1="996" y1="274" x2="1060" y2="274" stroke="#eef3f7" stroke-width="7"/>
  <line x1="996" y1="288" x2="1060" y2="288" stroke="#e3e9ee" stroke-width="7"/>
  <line x1="996" y1="302" x2="1060" y2="302" stroke="#eef3f7" stroke-width="7"/>
  <rect class="box" x="988" y="384" width="80" height="80"/>

  <!-- Justificacion -->
  <rect class="box" x="24" y="506" width="1052" height="230"/>
  <text class="t tit" x="44" y="532" font-size="14">Justificacion UI/UX de esta vista</text>
  <text class="t lbl" x="44" y="556">Ley de proximidad (Gestalt): la informacion se agrupa en tres bloques (descripcion, antecedentes generales, items), cada uno dentro de su propia tarjeta.</text>
  <text class="t lbl" x="44" y="576">Escaneo en F: la tabla usa la primera columna como etiqueta destacada (fondo #eef3f7) y la segunda como valor, de modo que el ojo baja por los rotulos.</text>
  <text class="t lbl" x="44" y="596">Tolerancia a datos incompletos: todo campo nulo se dibuja como "--" en vez de dejar la celda vacia, evitando que la interfaz "colapse" (rubrica 3.2.1).</text>
  <text class="t lbl" x="44" y="616">Control y libertad (Nielsen 3): siempre existe el boton "Volver al listado" y la ruta de migas de pan para deshacer la navegacion.</text>
  <text class="t lbl" x="44" y="636">Accesibilidad: cada tabla tiene caption para lector de pantalla, encabezados con scope="row"/"col" y el foco se mueve al detalle recien cargado.</text>
  <text class="t lbl" x="44" y="656">Tipografia: el nombre de la licitacion se muestra en 25px para dominar la jerarquia; los rotulos de tabla en 16px con peso 600.</text>
  <text class="t nota" x="44" y="686">Reordenamiento responsivo: en tablet la columna de etiquetas crece a 45%; en movil las tablas anchas quedan dentro de un contenedor con scroll propio</text>
  <text class="t nota" x="44" y="706">(table-responsive), de manera que la pagina nunca genera scroll horizontal completo.</text>
</svg>
